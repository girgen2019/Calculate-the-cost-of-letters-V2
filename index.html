<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Montserrat:wght@100;200;300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style-calc.css?v=20261023-3">
    <title>Сalculator</title>
    <link rel="icon" type="image/x-icon" href="./assets/calculator-fav.png">
</head>

<body>
    <video autoplay muted loop playsinline id="myVideo">
        <source src="./assets/Video.webm" type="video/webm">
        <source src="./assets/Video.mp4" type="video/mp4">
    </video>
    <header class="topbar">
        <div class="chip topbar__rate" id="rate">Loading rate…</div>
        <div class="chip topbar__weather">
            <span class="chip__label weather__place">Robinson Club</span>
            <!-- The visible date is our own text (DD.MM.YYYY on any phone locale);
                 the real date input lies invisibly on top of it and opens the picker -->
            <label class="weather__when" title="Choose a date">
                <span aria-hidden="true">📅</span>
                <span class="weather__date-full" id="weatherDateFull">…</span>
                <span class="weather__date-short" id="weatherDateShort">…</span>
                <input type="date" class="weather__date" id="weatherDate" aria-label="Forecast date">
            </label>
            <span class="weather__info" id="weatherInfo">Loading…</span>
        </div>
    </header>
    <main class="main">
        <!-- Input -->

        <div class="container">
            <input class="container__input" id="input" type="text" placeholder="Enter text..." autofocus>


        </div>
        <!-- Controls -->
        <div class="container">
            <div class="container__controls">

                <input type="image" class="heart__controls" id="heart" src="./assets/Heart.png" />

                <label class="container__Label">Robinson club

                    <input type="checkbox" id="robinson" checked>
                    <span class="checkmark"></span>
                </label>

                <label class="container__Label">Double fountains
                    <input type="checkbox" id="double">
                    <span class="checkmark"></span>
                </label>
                <!-- Mode switch: Price = the calculator, Letters = opens the letters check -->
                <div class="mode-switch" role="group" aria-label="Mode" data-active="price">
                    <button type="button" class="mode-switch__btn" data-mode="price" aria-pressed="true">Price</button>
                    <button type="button" class="mode-switch__btn" data-mode="letters" aria-pressed="false">Letters</button>
                </div>
            </div>
        </div>
        <!-- Output -->
        <div class="container">
            <div class="output_container">
                <div class="container__out" id="output">

                </div>
            </div>
        </div>
    </main>
    <script src="./js_App-calc.js?v=20261023-3"></script>

</body>

</html>
